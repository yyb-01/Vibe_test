<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple FPS Game</title>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Hide scrollbars */
        background-color: #000;
        font-family: Arial, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none; /* Let clicks pass through */
      }
      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background-color: white;
      }
      #crosshair::before {
        top: 9px;
        left: 0;
        width: 20px;
        height: 2px;
      }
      #crosshair::after {
        top: 0;
        left: 9px;
        width: 2px;
        height: 20px;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        pointer-events: none;
      }
      #instructions {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        z-index: 10;
        cursor: pointer;
      }
      #instructions h1 {
        font-size: 48px;
        margin-bottom: 20px;
      }
      #instructions p {
        font-size: 20px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="crosshair"></div>
    <div id="instructions">
      <h1>Click to Play</h1>
      <p>WASD to move</p>
      <p>Mouse to look around</p>
      <p>Click to shoot the red targets!</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
