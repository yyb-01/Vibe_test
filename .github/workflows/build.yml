name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - init-godot-project-16440751361188237273
  pull_request:
    branches:
      - main
      - master
      - init-godot-project-16440751361188237273

env:
  GODOT_VERSION: "4.2.2"
  PROJECT_PATH: "."

jobs:
  build-windows:
    name: Build Windows Export
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download Godot Engine and Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Import Assets (Headless Run)
        run: godot --headless --path "${PROJECT_PATH}" --import

      - name: Verify All Scripts, Scenes, and Resources
        run: godot --headless --path "${PROJECT_PATH}" tests/verify_resources.tscn

      - name: Verify HUD Layout at 1280x720
        run: godot --headless --resolution 1280x720 --path "${PROJECT_PATH}" tests/verify_hud_layout.tscn

      - name: Verify Main Menu Layout at 1280x720
        run: godot --headless --resolution 1280x720 --path "${PROJECT_PATH}" tests/verify_main_menu_layout.tscn

      - name: Verify Map Loading and Spawning
        run: godot --headless --path "${PROJECT_PATH}" tests/verify_map.tscn

      - name: Export Windows Executable
        run: |
          mkdir -p build/windows
          godot --headless --path "${PROJECT_PATH}" --export-release "Windows Desktop" build/windows/zombie_survival.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/
          if-no-files-found: error
