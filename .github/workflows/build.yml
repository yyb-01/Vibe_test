name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  GODOT_VERSION: "4.2.2"
  PROJECT_PATH: "."

jobs:
  build-windows:
    name: Build Windows Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download Godot Engine and Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Import Assets (Headless Run)
        run: godot --headless --editor --quit

      - name: Export Windows Executable
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/zombie_survival.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/zombie_survival.exe
          if-no-files-found: error
